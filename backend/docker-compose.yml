services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .chroma/
    volumes:
      - /app/.venv
      - ./.chroma:/app/.chroma
    depends_on:
      - postgres
    environment:
      - PYTHONUNBUFFERED=1

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nori
      - POSTGRES_PASSWORD=nori
      - POSTGRES_DB=nori
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
