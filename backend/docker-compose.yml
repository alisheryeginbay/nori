services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
    volumes:
      - /app/.venv
    depends_on:
      - chromadb
      - postgres
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql://nori:nori@postgres:5432/nori
      - PYTHONUNBUFFERED=1

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nori
      - POSTGRES_PASSWORD=nori
      - POSTGRES_DB=nori
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  chroma_data:
  postgres_data:
